<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Accio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐕</text></svg>">
  <style>
    /* ... keep all your existing styles ... */
  </style>
</head>
<body>
<header>
  <div class="trail">🐾 🐾 🐾</div>
  <h1>Accio's <span>Walk</span> Checks</h1>
  <div class="sub">progress tracker</div>
</header>

<main>
<!-- ... your existing tabs ... -->

<!-- WEEK -->
<div id="tab-week" class="hidden">
  <div class="week-header">
    <h2>📅 Weekly Walk Plan</h2>
    <p class="subtitle">Two walks per day</p>
    <div class="week-selector">
      <label for="weekStart">Week starting:</label>
      <input type="date" id="weekStart" value="">
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="weekgrid" id="weekGrid"></div>

  <div class="week-notes">
    <h3>📓 Notes</h3>
    <textarea id="weekNotes" placeholder="Add notes about this week..."></textarea>
  </div>

  <div class="week-cycle-note">
    <div class="icon">⚠️</div>
    <div><strong>Cycle note:</strong> No Red walk around day 14.</div>
  </div>

  <button class="small" id="clearWeek" type="button" style="margin-top:8px">Clear week</button>
  <button class="main" id="saveWeekBtn" type="button" style="margin-top:12px">Save weekly plan</button>
</div>

<!-- ... rest of your tabs ... -->
</main>

<nav>
  <button data-tab="new" class="active">➕ New</button>
  <button data-tab="week">📅 Week</button>
  <button data-tab="daily">✔️ Daily</button>
  <button data-tab="history">📖 History</button>
  <button data-tab="progress">📈 Progress</button>
</nav>
<div id="toast"></div>

<script>
// ... keep all your existing constants ...

/* ---------- Data ---------- */
let walks = load("accioWalks_v3", []);
if(!Array.isArray(walks)) walks = [];
let syncTimer = null;
let syncInFlight = false;
let syncQueued = false;

// NEW: Weekly walks data structure
let week = load("accioWeek_v1", null);
if(!week || !week.days) week = { weekStarting: todayStr(), days: {}, notes: "" };

DAYS.forEach(d => {
  if(!week.days[d]) week.days[d] = { walks: ["", ""] };
  week.days[d].walks = (week.days[d].walks||[]).map(c => WEEK_CATS.includes(c) ? c : "");
  while(week.days[d].walks.length < 2) week.days[d].walks.push("");
  week.days[d].walks = week.days[d].walks.slice(0, 2);
});

let daily = load("accioDaily_v1", {});
if(!daily || typeof daily !== "object" || Array.isArray(daily)) daily = {};

// NEW: Set default week start date to Monday of current week
function setDefaultWeekStart() {
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  $("weekStart").value = monday.toISOString().slice(0, 10);
}

/* ---------- Sync with Google Sheets ---------- */
function syncPayload() {
  return {
    walks: walks,
    daily: daily,
    weeklyWalks: getWeeklyWalksData() // NEW: Include weekly walks
  };
}

function getWeeklyWalksData() {
  const weeklyData = [];
  const weekStart = new Date($("weekStart").value);
  const weekDays = [];

  // Create array of days for this week
  for (let i = 0; i < 7; i++) {
    const day = new Date(weekStart);
    day.setDate(day.getDate() + i);
    weekDays.push(day.toISOString().slice(0, 10));
  }

  // Convert to the format expected by the script
  weekDays.forEach(day => {
    const dayName = DAYS[new Date(day).getDay()];
    if (week.days[dayName]) {
      weeklyData.push({
        weekStarting: week.weekStarting,
        day: dayName,
        walk1: week.days[dayName].walks[0] || "",
        walk2: week.days[dayName].walks[1] || "",
        notes: week.notes
      });
    }
  });

  return weeklyData;
}

async function saveWeek() {
  saveWeekLocal();
  if(syncEnabled()) {
    try {
      const response = await fetch(SHEET_URL, {
        method: "POST",
        headers: {"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(syncPayload())
      });
      if(!response.ok) throw new Error("HTTP " + response.status);
      toast("Weekly plan saved to Google Sheets 🐾");
    } catch(e) {
      console.error(e);
      toast("Sync failed: " + e.message);
    }
  } else {
    toast("Weekly plan saved locally 🐾");
  }
}

function saveWeekLocal() {
  week.weekStarting = $("weekStart").value;
  week.notes = $("weekNotes").value;
  localStorage.setItem("accioWeek_v1", JSON.stringify(week));
}

/* ---------- Weekly Walk UI Functions ---------- */
function renderWeek() {
  const weekStart = new Date($("weekStart").value);
  const weekDays = [];

  // Create array of days for this week
  for (let i = 0; i < 7; i++) {
    const day = new Date(weekStart);
    day.setDate(day.getDate() + i);
    weekDays.push({
      date: day.toISOString().slice(0, 10),
      dayName: DAYS[day.getDay()],
      shortName: DAY_SHORT[day.getDay()]
    });
  }

  // Build the week grid
  const grid = $("weekGrid");
  grid.innerHTML = weekDays.map((day, index) => {
    const dayWalks = week.days[day.dayName] || { walks: ["", ""] };
    return `
      <div class="week-day-card">
        <h3>${day.shortName}</h3>
        <div class="week-walks">
          <div class="week-walk">
            <select class="week-walk-select" data-day="${day.dayName}" data-walk="0">
              <option value="">–</option>
              ${WEEK_CATS.map(cat => `
                <option value="${esc(cat)}" ${dayWalks.walks[0] === cat ? 'selected' : ''}>
                  ${CAT_INFO[cat]?.icon || ''} ${esc(cat)}
                </option>
              `).join('')}
            </select>
          </div>
          <div class="week-walk">
            <select class="week-walk-select" data-day="${day.dayName}" data-walk="1">
              <option value="">–</option>
              ${WEEK_CATS.map(cat => `
                <option value="${esc(cat)}" ${dayWalks.walks[1] === cat ? 'selected' : ''}>
                  ${CAT_INFO[cat]?.icon || ''} ${esc(cat)}
                </option>
              `).join('')}
            </select>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Add event listeners to walk selects
  document.querySelectorAll('.week-walk-select').forEach(select => {
    select.addEventListener('change', function() {
      const dayName = this.dataset.day;
      const walkIndex = parseInt(this.dataset.walk);
      if(!week.days[dayName]) week.days[dayName] = { walks: ["", ""] };
      week.days[dayName].walks[walkIndex] = this.value;
    });
  });

  // Set week notes
  $("weekNotes").value = week.notes || "";
}

function clearWeek() {
  if(confirm("Clear this week's plan?")) {
    week.days = {};
    DAYS.forEach(d => week.days[d] = { walks: ["", ""] });
    week.notes = "";
    $("weekNotes").value = "";
    renderWeek();
    saveWeekLocal();
    toast("Week cleared 🐾");
  }
}

$("saveWeekBtn").onclick = saveWeek;
$("clearWeek").onclick = clearWeek;
$("weekStart").addEventListener('change', function() {
  week.weekStarting = this.value;
  renderWeek();
});

/* ---------- Backup/Import with Weekly Walks ---------- */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({
    walks,
    week,
    daily
  }, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "accio-walks-"+todayStr()+".json";
  a.click();
};

$("importFile").onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.walks)) throw 0;

      if(confirm("Replace current data with the imported file?")) {
        walks = d.walks;
        save();

        if(d.week && d.week.days) {
          week = d.week;
          // Ensure week has proper structure
          if(!week.weekStarting) week.weekStarting = todayStr();
          if(!week.notes) week.notes = "";
          DAYS.forEach(x => {
            if(!week.days[x]) week.days[x] = { walks: ["", ""] };
            week.days[x].walks = (week.days[x].walks||[]).map(c => WEEK_CATS.includes(c) ? c : "");
            while(week.days[x].walks.length < 2) week.days[x].walks.push("");
            week.days[x].walks = week.days[x].walks.slice(0, 2);
          });
          saveWeekLocal();
        }

        if(d.daily && typeof d.daily==="object") {
          daily = d.daily;
          saveDaily();
        }

        // Update UI
        setDefaultWeekStart();
        renderAll();
        toast("Imported ✔");
      }
    } catch(err) {
      console.error(err);
      toast("Invalid file");
    }
  };
  r.readAsText(f);
};

/* ---------- Initialize ---------- */
function renderAll() {
  renderWeek();
  renderDailyForm();
  renderDailyHistory();
  renderHistory();
  renderProgress();
  renderDailyReport();
}

// Set default week start when page loads
setDefaultWeekStart();
renderWeek();
loadFromSheet();
</script>
</body>
</html>
